<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arena Strike</title>
<style>
:root{box-sizing:border-box}
html,body{height:100%;margin:0;background:#101418;color:#fff;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;inset:0;pointer-events:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#cross{position:absolute;left:50%;top:50%;width:0;height:0}
#cross i{position:absolute;background:#3cff6a;box-shadow:0 0 2px #000}
#cross i:nth-child(1){left:-1px;top:-13px;width:2px;height:8px}
#cross i:nth-child(2){left:-1px;top:5px;width:2px;height:8px}
#cross i:nth-child(3){left:-13px;top:-1px;width:8px;height:2px}
#cross i:nth-child(4){left:5px;top:-1px;width:8px;height:2px}
#cross.hit i{background:#f33}
#rad{position:absolute;left:10px;top:calc(env(safe-area-inset-top,0px) + 10px);width:110px;height:110px;border-radius:50%;border:2px solid #fff4}
#mny{position:absolute;left:12px;top:calc(env(safe-area-inset-top,0px) + 130px);color:#7dff7d;font-weight:800;font-size:20px;text-shadow:0 1px 3px #000}
#wl{position:absolute;left:12px;top:calc(env(safe-area-inset-top,0px) + 160px);font-size:12px;line-height:1.5;text-shadow:0 1px 2px #000}
#wl .a{color:#ffb347;font-weight:700}
#kf{position:absolute;right:10px;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;flex-direction:column;gap:3px;align-items:flex-end;font-size:12px}
#kf div{background:#000a;padding:3px 8px;border-radius:4px}
#bar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;gap:14px;align-items:flex-end;background:#0009;padding:6px 14px;border-radius:8px}
#bar .st{display:flex;flex-direction:column;align-items:center;line-height:1}
#bar small{font-size:8px;opacity:.7;letter-spacing:1px}#bar b{font-size:30px;font-weight:700}
#bar .am{flex-direction:row;align-items:baseline;gap:4px;border-left:2px solid #fff3;padding-left:14px}#rs{font-size:14px;opacity:.7}
@media (pointer:coarse){#bar{transform:translateX(-50%) scale(.8);transform-origin:bottom center}}
#tab,#shop{position:fixed;inset:0;display:none;z-index:4;background:#000a;padding:20px;overflow:auto}
#tbl,#shopin{max-width:520px;margin:6vh auto;background:#161b22;border-radius:10px;padding:14px}
.row{display:grid;grid-template-columns:30px 1fr 50px 50px;padding:6px 4px;border-bottom:1px solid #fff1}.row.h{opacity:.6;font-size:12px}.row.me{color:#ffb347}
.it{display:flex;justify-content:space-between;align-items:center;padding:8px 4px;border-bottom:1px solid #fff1}
.it button{padding:8px 14px;border:0;border-radius:6px;background:#2ea043;color:#fff;font-weight:700}.it button:disabled{background:#444;opacity:.6}
#rel,#buy,#scb{right:12px;width:48px;height:48px;border-radius:12px;background:#fff3;border:2px solid #fff5;align-items:center;justify-content:center;font-size:12px}
#rel{top:40%}#buy{top:calc(40% + 56px)}#scb{top:calc(40% + 112px)}
#swap{right:24px;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);width:56px;height:56px;border-radius:50%;background:#fff3;border:2px solid #fff5;align-items:center;justify-content:center;font-size:12px}
#msg{position:absolute;left:0;right:0;top:35%;text-align:center;font-size:26px;font-weight:700;text-shadow:0 2px 6px #000}
#flash{position:absolute;inset:0;background:#f003;opacity:0;transition:opacity .25s}
#menu{position:fixed;inset:0;background:#101418ee;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center;z-index:5}
#menu select,#menu input,#menu button{font-size:18px;padding:12px 14px;border-radius:10px;border:0;width:min(300px,80vw)}
#menu button{background:#ff5a36;color:#fff;font-weight:700}
#menu small{opacity:.7;max-width:320px;line-height:1.4}
.tc{position:fixed;z-index:3;display:none}
#joy{left:24px;bottom:calc(env(safe-area-inset-bottom,0px) + 30px);width:120px;height:120px;border-radius:50%;background:#fff2;border:2px solid #fff4}
#knob{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:#fff7}
#fire{right:24px;bottom:calc(env(safe-area-inset-bottom,0px) + 40px);width:92px;height:92px;border-radius:50%;background:#ff5a36aa;border:2px solid #fff6;font-weight:700;display:none;align-items:center;justify-content:center}
#jump{right:130px;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);width:60px;height:60px;border-radius:50%;background:#fff3;border:2px solid #fff5;align-items:center;justify-content:center}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud" style="display:none"><div id="cross"><i></i><i></i><i></i><i></i></div><canvas id="rad" width="110" height="110"></canvas><div id="mny"></div><div id="wl"></div><div id="kf"></div>
<div id="bar"><div class="st"><small>HEALTH</small><b id="hpv">100</b></div><div class="st"><small>ARMOR</small><b id="arv">0</b></div><div class="st am"><b id="am">12</b><span id="rs"></span></div></div><div id="msg"></div><div id="flash"></div></div>
<div id="tab"><div id="tbl"></div></div><div id="shop"><div id="shopin"></div></div>
<div class="tc" id="rel">R</div><div class="tc" id="buy">BUY</div><div class="tc" id="scb">TAB</div>
<div class="tc" id="joy"><div id="knob"></div></div>
<div class="tc" id="fire">FIRE</div><div class="tc" id="jump">JUMP</div><div class="tc" id="swap">GUN</div>
<div id="menu">
<h1 style="margin:0">ARENA STRIKE</h1>
<input id="name" placeholder="Your name" maxlength="12">
<input id="code" placeholder="Room code (share with friends)" maxlength="16">
<select id="map"><option value="0">Map: Warehouse</option><option value="1">Map: Desert Ruins</option><option value="2">Map: Neon Grid</option></select>
<button id="play">PLAY</button>
<input id="inv" readonly style="font-size:12px">
<small id="info">Friends must pick the same map AND type the same room code. Guns: keys 1-5 / mouse wheel (GUN button on phone). Desktop: WASD + mouse, click to shoot, Space to jump. Phone: left stick to move, drag right side to aim, FIRE button.</small>
</div>

const add=(x,z,w,d,h,c)=>{boxes.push({x,z,w,d,h});const geo=new T.BoxGeometry(w,h,d),mm=new T.Mesh(geo,new T.MeshLambertMaterial({color:c,map:bt,emissive:m.neon?c:0,emissiveIntensity:.35}));mm.position.set(x,h/2,z);mm.castShadow=mm.receiveShadow=true;

add(0,-S,S*2,1,4,m.wall);add(0,S,S*2,1,4,m.wall);add(-S,0,1,S*2,4,m.wall);add(S,0,1,S*2,4,m.wall);m.b.forEach(b=>add(...b));
const a=S-6;spawns=[[-a,-a],[a,-a],[-a,a],[a,a],[0,-a],[0,a],[-a,0],[a,0]]}

const W=[
{n:'Pistol',p:0,mg:12,rs:48,rl:1200,dm:22,rt:300,sp:.004,pl:1,mz:-.3,vm:[[.06,.08,.3,0,0,-.1,0x333333],[.05,.1,.06,0,-.08,.02,0x222222]]},

{n:'SMG',p:900,mg:25,rs:100,rl:1800,dm:9,rt:65,sp:.04,pl:1,mz:-.35,vm:[[.07,.1,.4,0,0,-.1,0x3a3a44],[.04,.18,.06,0,-.12,0,0x222222]]},
{n:'Shotgun',p:1200,mg:6,rs:30,rl:2400,dm:11,rt:850,sp:.07,pl:8,mz:-.9,vm:[[.08,.08,.8,0,0,-.2,0x6b4a2b],[.06,.06,.5,0,.03,-.65,0x222222]]},
{n:'Sniper',p:3000,mg:5,rs:20,rl:2800,dm:95,rt:1300,sp:0,pl:1,mz:-1.3,vm:[[.06,.07,1,0,0,-.3,0x1d2a1d],[.05,.05,.25,0,.08,-.2,0x111111]]}];
let wi=0,kick=0,flash=0;scene.add(cam);const vm=new T.Group(),gun=new T.Group(),flashM=new T.Mesh(new T.SphereGeometry(.08,8,8),new T.MeshBasicMaterial({color:0xffdd66}));vm.add(gun,flashM);cam.add(vm);
function setW(i,dir=1){let k=0;i=(i+W.length)%W.length;while(!inv[i].own&&k++<6)i=(i+dir+W.length)%W.length;wi=i;const w=W[wi];while(gun.children.length)gun.remove(gun.children[0]);
w.vm.forEach(([a,b,c,x,y,z,col])=>{const o=new T.Mesh(new T.BoxGeometry(a,b,c),new T.MeshLambertMaterial({color:col}));o.position.set(x,y,z);gun.add(o)});flashM.position.set(0,0,w.mz);hud()}

const k=wi+'|'+inv.map(v=>v.own?1:0).join('');if(k!==lastWl){lastWl=k;const el=$('wl');el.innerHTML='';W.forEach((x,i)=>{if(!inv[i].own)return;const d=document.createElement('div');d.textContent=(i+1)+' '+x.n;if(i===wi)d.className='a';el.appendChild(d)})}

function feed(a,b){const d=document.createElement('div');d.textContent=a+'  \u2715  '+b;$('kf').appendChild(d);setTimeout(()=>d.remove(),5000)}

let ac;function beep(f,d,v=.08){try{ac=ac||new (window.AudioContext||webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type='sawtooth';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(40,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(t+d)}catch(_){}}
// state
const me={x:0,y:0,z:0,vy:0,yaw:0,pitch:0,hp:100,k:0,d:0,dead:0,kb:null,nm:'Player',m:1000,ar:0};
let room=null,myPeer=null,peers=[],shotN=0,lastShot=0,sh=null,started=false;

const colorOf=s=>{let h=0;for(const ch of s)h=(h*31+ch.charCodeAt(0))>>>0;return new T.Color().setHSL((h%360)/360,.7,.5)};
function mkAvatar(col,name){const g=new T.Group(),L=c=>new T.MeshLambertMaterial({color:c}),mt=L(col),dk=L(0x2a2f3a),sk=L(0xf0c8a0),bk=L(0x15171c),u=g.userData;

// ---- WebRTC (PeerJS) room: first player in a room code hosts, others connect to the host ----
function makeRoom(code,mapId){
const base='arenastrike-'+(code.toLowerCase().replace(/[^a-z0-9]/g,'')||'public')+'-m'+mapId;
const st={},hs=[],conns=new Map();let myId=null,hostConn=null,isHost=false,done=false;
const list=()=>Object.keys(st).map(id=>({peer:id,isMe:id===myId,presence:st[id]}));
const fire=()=>{const l=list();hs.forEach(f=>f({peers:l}))};
const bcast=(m,except)=>conns.forEach((c,id)=>{if(id!==except&&c.open)c.send(m)});
const room={role:'',peers:list,onPeers:f=>{hs.push(f)},presence:async patch=>{if(!myId)return;st[myId]=Object.assign(st[myId]||{},patch);
if(isHost)bcast({t:'u',id:myId,d:st[myId]});else if(hostConn&&hostConn.open)hostConn.send({t:'p',d:st[myId]})}};
return new Promise((res,rej)=>{
const fail=e=>{if(!done){done=true;rej(e)}};setTimeout(()=>fail(new Error('timeout')),12000);
const asClient=()=>{const cp=new Peer();cp.on('error',fail);cp.on('open',id=>{myId=id;st[id]={};const c=cp.connect(base,{reliable:true,serialization:'json'});
c.on('open',()=>{hostConn=c;room.role='client';if(!done){done=true;res(room)}});
c.on('data',m=>{if(m.t==='s'){for(const k in m.all)if(k!==myId)st[k]=m.all[k];fire()}else if(m.t==='u'){if(m.id!==myId)st[m.id]=m.d;fire()}else if(m.t==='l'){delete st[m.id];fire()}});
c.on('close',()=>{$('msg').textContent='Host left - reload the page to start a new match'})})};
const hp=new Peer(base);
hp.on('open',id=>{myId=id;isHost=true;room.role='host';st[id]={};
hp.on('connection',c=>{c.on('open',()=>{conns.set(c.peer,c);c.send({t:'s',all:st})});
c.on('data',m=>{if(m.t==='p'){st[c.peer]=m.d;bcast({t:'u',id:c.peer,d:m.d},c.peer);fire()}});
c.on('close',()=>{conns.delete(c.peer);delete st[c.peer];bcast({t:'l',id:c.peer});fire()})});
if(!done){done=true;res(room)}});
hp.on('error',e=>{if(!myId&&e.type==='unavailable-id'){hp.destroy();asClient()}else if(!myId)fail(e)})})}

$('name').value=(()=>{try{return localStorage.getItem('as_name')||''}catch(_){return ''}})();
const NAMES=['Warehouse','Desert Ruins','Neon Grid'],LINK=location.href.split('#')[0];function updInv(){$('inv').value='Join my Arena Strike match! '+LINK+' | Map: '+NAMES[$('map').value]+' | Room code: '+($('code').value.trim().toLowerCase()||'public')}$('code').oninput=$('map').onchange=updInv;$('inv').onfocus=e=>e.target.select();updInv();$('play').onclick=async()=>{me.nm=($('name').value.trim()||'Player'+(Math.random()*90+10|0)).slice(0,12);try{localStorage.setItem('as_name',me.nm)}catch(_){}
const code=$('code').value.trim().toLowerCase(),mapId=+$('map').value;$('play').disabled=true;$('play').textContent='Connecting...';
try{room=await makeRoom(code,mapId);room.onPeers(ch=>onPeers(ch.peers));onPeers(room.peers())}catch(e){room=null}

if(!room){$('msg').textContent='Could not connect - check your internet or try another room code';setTimeout(()=>{if(!me.dead)$('msg').textContent=''},3000)}
else{await room.presence({nm:me.nm,x:me.x,y:0,z:me.z,yw:0,hp:100,k:0,d:0}).catch(()=>{})}};
